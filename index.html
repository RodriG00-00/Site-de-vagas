<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estágios - Divulgação de Vagas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <header class="bg-blue-700 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">Portal de Estágios</h1>
        <p class="mt-2 text-blue-100">Cadastre e encontre as melhores oportunidades</p>
    </header>

    <main class="container mx-auto p-4 mt-8 flex flex-col md:flex-row gap-8 items-start">
        
        <section class="w-full md:w-1/3 bg-white p-6 rounded-lg shadow-md border border-gray-100">
            <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Cadastrar Nova Vaga</h2>
            <form id="vagaForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Título da Vaga</label>
                    <input type="text" id="titulo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring focus:ring-blue-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Empresa</label>
                    <input type="text" id="empresa" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring focus:ring-blue-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Descrição e Requisitos</label>
                    <textarea id="descricao" required rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring focus:ring-blue-200 outline-none"></textarea>
                </div>
                <div id="mensagem" class="hidden p-3 rounded text-sm text-center font-medium"></div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-semibold shadow-sm">Publicar Vaga</button>
            </form>
        </section>

        <section class="w-full md:w-2/3">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Vagas Disponíveis</h2>
            <div id="vagasContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
        </section>
    </main>

    <!-- FIREBASE CLÁSSICO (NÃO PRECISA DE SERVIDOR LIVE SERVER) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- NOSSO SCRIPT SEM O "module" -->
    <script src="app.js"></script>
</body>
</html>
